<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שלח לי מלאך - הרכיבו קואליציה</title>
<style>
  :root{
    --bg:#0f1117;
    --panel:#1a1d27;
    --text:#f2f2f2;
    --muted:#9aa0ac;
    --accent:#3ddc84;
    --danger:#e05263;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Segoe UI", Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  h1{margin:0;font-size:1.5rem;text-align:center}
  #status{
    font-size:1.1rem;
    font-weight:bold;
    min-height:1.4em;
    text-align:center;
  }
  #status.ok{color:var(--accent)}
  #status.no{color:var(--muted)}
  .angels-strip{
    display:flex;
    gap:8px;
    justify-content:center;
    align-items:center;
  }
  .angel-icon{
    width:36px;
    height:36px;
  }
  .angel-icon svg, .angel-icon img{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
  }
  .angel-count{
    font-weight:bold;
    color:var(--muted);
  }

  #chart-wrap{width:100%;max-width:640px}
  svg{width:100%;height:auto;display:block}
  .seat{stroke:#000;stroke-width:0.5;transition:fill .2s}

  #progress-bar{
    width:100%;
    max-width:640px;
    height:14px;
    background:#2a2e3a;
    border-radius:8px;
    overflow:hidden;
  }
  #progress-fill{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .3s;
  }

  #parties{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    max-width:680px;
  }
  .party-card{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 10px;
    border-radius:10px;
    background:var(--panel);
    border:2px solid transparent;
    cursor:pointer;
    user-select:none;
    transition:border-color .15s, transform .1s;
    flex:0 0 auto;
    font-size:.9rem;
  }
  .party-card:active{transform:scale(0.97)}
  .party-card.selected{border-color:var(--accent)}
  .dot{width:16px;height:16px;border-radius:50%;flex-shrink:0}
  .party-name{font-weight:600}
  .party-seats{color:var(--muted);font-size:.9rem}

  #actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  button{
    font-family:inherit;
    font-size:1rem;
    padding:10px 20px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    background:var(--accent);
    color:#06210f;
    font-weight:bold;
  }
  button.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--muted);
    font-weight:normal;
  }
  button:disabled{opacity:.4;cursor:not-allowed}

  #overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px 20px 90px;
  }
  #overlay.show{display:flex}
  #conflict-box{
    background:#e8dcc0;
    background-image:
      radial-gradient(rgba(0,0,0,.05) 1px, transparent 1px);
    background-size:6px 6px;
    border:6px solid #3a2e1a;
    border-radius:6px;
    padding:26px 22px;
    max-width:340px;
    width:100%;
    text-align:center;
    transform:rotate(-2deg);
    box-shadow:0 10px 25px rgba(0,0,0,.5);
    font-family:"Comic Sans MS","Marker Felt", cursive, sans-serif;
    position:relative;
  }
  #conflict-box::before{
    content:"";
    position:absolute;
    bottom:-64px;
    left:50%;
    transform:translateX(-50%);
    width:14px;
    height:70px;
    background:linear-gradient(90deg,#4a3218,#8a6135 45%,#4a3218);
    border-radius:0 0 5px 5px;
    box-shadow:0 4px 6px rgba(0,0,0,.35);
    z-index:-1;
  }
  #conflict-box .cf-title{
    font-size:1.25rem;
    font-weight:bold;
    color:#1a1a1a;
    margin-bottom:10px;
    line-height:1.4;
    transform:rotate(1deg);
  }
  #conflict-box .cf-title .cf-redline{
    display:block;
    margin-top:4px;
    color:#8B0000;
  }
  #conflict-box .cf-sub{
    color:#333;
    font-size:1.1rem;
    margin-bottom:22px;
    transform:rotate(-1deg);
  }
  #conflict-box .cf-actions{
    display:flex;
    gap:10px;
    justify-content:center;
  }
  #conflict-box button{
    font-family:inherit;
    font-weight:bold;
    border-radius:8px;
    border:3px solid #1a1a1a;
  }
  #conflict-box button.danger{
    background:var(--danger);
    color:#fff;
  }
  #conflict-box button.go{
    background:var(--accent);
    color:#06210f;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .cf-angel-icon{
    width:44px;
    height:44px;
    display:inline-flex;
  }
  .cf-angel-icon img, .cf-angel-icon svg{
    width:100%;
    height:100%;
    display:block;
    object-fit:contain;
  }

  .angel-pop{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:100;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation:angelPop 1.5s ease forwards;
  }
  .angel-pop svg, .angel-pop img{
    width:150px;
    height:150px;
    display:block;
    object-fit:contain;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.5));
  }
  .angel-bubble{
    background:#fff;
    color:#111;
    border:3px solid #000;
    border-radius:14px;
    padding:8px 16px;
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
    font-weight:bold;
    font-size:1.05rem;
    max-width:230px;
    text-align:center;
    margin-bottom:10px;
    position:relative;
    unicode-bidi:plaintext;
  }
  .angel-bubble::after{
    content:"";
    position:absolute;
    bottom:-14px;
    left:50%;
    transform:translateX(-50%);
    border-width:14px 10px 0 10px;
    border-style:solid;
    border-color:#000 transparent transparent transparent;
  }
  .angel-bubble::before{
    content:"";
    position:absolute;
    bottom:-9px;
    left:50%;
    transform:translateX(-50%);
    border-width:11px 7px 0 7px;
    border-style:solid;
    border-color:#fff transparent transparent transparent;
    z-index:1;
  }
  @keyframes angelPop{
    0%   { opacity:0; transform:translate(-50%,-50%) scale(0.4) rotate(-8deg); }
    12%  { opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(4deg); }
    20%  { transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    85%  { opacity:1; }
    100% { opacity:0; transform:translate(-50%,-50%) scale(0.9) rotate(0deg); }
  }

  .party-card.locked{cursor:pointer}

  #infoBtn{
    position:fixed;
    top:14px;
    left:14px;
    z-index:70;
    width:34px;
    height:34px;
    border-radius:50%;
    background:var(--accent);
    color:#06210f;
    font-weight:bold;
    font-style:italic;
    border:2px solid #000;
    font-size:1.1rem;
    cursor:pointer;
    padding:0;
    line-height:1;
  }
  #infoBubble{
    position:fixed;
    top:54px;
    left:14px;
    z-index:70;
    max-width:250px;
    background:#fff;
    color:#111;
    border:3px solid #000;
    border-radius:12px;
    padding:12px 14px;
    font-size:.9rem;
    line-height:1.5;
    display:none;
    text-align:right;
  }
  #infoBubble.show{display:block}

  #resultsOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
    padding:20px;
  }
  #resultsOverlay.show{display:flex}
  #results-box{
    background:var(--panel);
    border:2px solid var(--accent);
    border-radius:16px;
    padding:26px 22px;
    max-width:380px;
    width:100%;
    text-align:center;
  }
  #results-box .res-title{font-size:1.5rem;font-weight:bold;margin-bottom:14px}
  #results-box #res-body{color:var(--text);margin-bottom:20px;line-height:1.7}
  #results-box .res-score{font-size:1.6rem;font-weight:bold;color:var(--accent);margin-top:8px}
  #results-box .res-actions{display:flex;justify-content:center;gap:10px}
  #results-box .res-img{
    width:150px;
    height:auto;
    border-radius:12px;
    margin:0 auto 14px;
    display:block;
    border:2px solid var(--border);
  }
  #results-box .res-msg{
    font-weight:bold;
    margin-bottom:10px;
    line-height:1.5;
  }
  #results-box .res-quote{
    font-style:italic;
    color:var(--muted);
    margin-bottom:14px;
    line-height:1.5;
  }
</style>
</head>
<body>

<button id="infoBtn" title="על המשחק">i</button>
<div id="infoBubble">
  עם כל הגושים, החרמות, וההבטחות, הגיע הזמן לוותר קצת.
  תוכלו להרכיב קואליציה? ולפתור לכולנו את הפלונטר הפוליטי?
</div>

<h1>👼 שלח לי מלאך</h1>
<p style="color:var(--muted);text-align:center;max-width:500px;margin:0">
  תוכלו לפתור את הפלונטר הפוליטי?
</p>

<div id="chart-wrap"><svg id="chart" viewBox="0 0 600 320"></svg></div>

<div id="progress-bar"><div id="progress-fill"></div></div>
<div id="status" class="no">0 / 120 מנדטים (חסרים 61 להרכבת קואליציה)</div>
<div id="angels-strip" class="angels-strip"></div>

<div id="parties"></div>

<div id="actions">
  <button id="finishBtn" disabled>הגישו לנשיא 🏛️</button>
  <button id="resetBtn" class="secondary">התחילו מחדש</button>
</div>

<div id="overlay">
  <div id="conflict-box">
    <div class="cf-title" id="cf-title"></div>
    <div class="cf-sub" id="cf-sub"></div>
    <div class="cf-actions" id="cf-actions"></div>
  </div>
</div>

<div id="resultsOverlay">
  <div id="results-box">
    <div class="res-title">🏛️ הוגשה לנשיא!</div>
    <div id="res-body"></div>
    <div class="res-actions">
      <button id="res-share">שתפו 🔗</button>
      <button id="res-close" class="secondary">חזרה למשחק</button>
    </div>
  </div>
</div>

<script>
/* ---------- נתוני המפלגות ----------
   ערכו כאן חופשי: שם, מספר מנדטים וצבע. סה"כ המנדטים צריך להסתכם ל-120.
------------------------------------- */
const parties = [
  { name: "איזנקוט",        seats: 23, color: "#4C72B0", redlines: ["איזנקוט ראש ממשלה"],        tags: [], camp: 'B' },
  { name: "הליכוד",         seats: 23, color: "#F2B134", redlines: ["רק ביבי", "רק לא ערבים"],     tags: [], camp: 'A' },
  { name: "בנט&לפיד",       seats: 11, color: "#55A868", redlines: ["רק לא ערבים", "רק לא ביבי"], tags: [], camp: 'B' },
  { name: "גולן",           seats: 10,  color: "#C44E52", redlines: ["רק לא שטחים", "רק לא ביבי"], tags: [], camp: 'B' },
  { name: "חרדים אשכנז",    seats: 8,  color: "#000000", redlines: ["רק לא גיוס"],                tags: [], camp: 'A' },
  { name: "חרדים מזרח",     seats: 8,  color: "#4A4A4A", redlines: ["רק לא גיוס"],                tags: [], camp: 'A' },
  { name: "ליברמן",         seats: 8,  color: "#3399CC", redlines: ["גיוס חרדים", "רק לא ביבי"],  tags: [], camp: 'B' },
  { name: "בן גביר",        seats: 7,  color: "#8B0000", redlines: ["רק לא ערבים", "רק ביבי"],    tags: ["is_bengvir"], camp: 'A' },
  { name: "ערבים",          seats: 7,  color: "#2E8B57", redlines: ["רק לא ימין"],                tags: ["is_arab"], camp: null },
  { name: "סמוטריץ'",       seats: 6,  color: "#DA8BC3", redlines: ["רק שטחים", "רק ביבי", "רק לא ערבים"], tags: [], camp: 'A' },
  { name: "רע\"מ",          seats: 5,  color: "#006633", redlines: ["רק לא בן גביר"],             tags: ["is_arab"], camp: 'B' },
  { name: "וינטר",          seats: 4,  color: "#937860", redlines: ["גיוס חרדים", "רק ביבי"],     tags: [], camp: 'A' },
];

/* ---------- טבלת סתירות בין קווים אדומים ----------
   כל כלל מגדיר שני "צדדים" סותרים. צד יכול להיות טקסט של קו אדום (type:'text')
   או תגית זהות (type:'tag'). מפלגה "מחזיקה" בצד אם יש לה את הטקסט הזה ברשימת
   redlines שלה, או את התגית הזו ברשימת tags שלה.
------------------------------------------------------ */
const RULES = [
  { a:{type:'text', value:'איזנקוט ראש ממשלה'}, b:{type:'text', value:'רק ביבי'} },
  { a:{type:'text', value:'איזנקוט ראש ממשלה'}, b:{type:'text', value:'בנט ראש ממשלה'} },
  { a:{type:'text', value:'רק ביבי'},           b:{type:'text', value:'בנט ראש ממשלה'} },
  { a:{type:'text', value:'רק ביבי'},           b:{type:'text', value:'רק לא ביבי'} },
  { a:{type:'text', value:'רק ביבי'},           b:{type:'text', value:'רק לא ימין'} },
  { a:{type:'text', value:'רק לא שטחים'},       b:{type:'text', value:'רק שטחים'} },
  { a:{type:'text', value:'רק לא גיוס'},        b:{type:'text', value:'גיוס חרדים'} },
  { a:{type:'text', value:'רק לא ערבים'},       b:{type:'tag',  value:'is_arab'} },
  { a:{type:'text', value:'רק לא בן גביר'},     b:{type:'tag',  value:'is_bengvir'} },
];

function holds(party, side) {
  return side.type === 'text'
    ? party.redlines.includes(side.value)
    : party.tags.includes(side.value);
}

const TOTAL_SEATS = 120;
const MAJORITY = 61;
let coalitionOrder = [];           // סדר ההוספה של אינדקסי מפלגות שנבחרו
const waivers = new Set();         // מפתחות "partyIdx::טקסט" של קווים אדומים שהמפלגה עצמה ויתרה עליהם
let pendingAdd = null;             // מצב תהליך ההוספה הפעיל (אם יש התנגשות פתוחה)
let waiverCount = 0;               // כמה ויתורים נעשו בסה"כ (ללא הגבלה)
let gameFinished = false;

/* ---------- בניית מערך של כל כיסא בודד, משויך למפלגה ---------- */
function buildSeatList() {
  const seatList = [];
  parties.forEach((p, pIndex) => {
    for (let i = 0; i < p.seats; i++) seatList.push(pIndex);
  });
  return seatList;
}

/* ---------- פריסת חצי-גורן (חצי מעגל) לכיסאות ---------- */
function layoutSeats(count) {
  // מחלקים לשורות עם רדיוסים גדלים; כל שורה מקבלת יותר כיסאות
  const rows = [];
  let remaining = count;
  let rowCount = Math.ceil(Math.sqrt(count / 1.6));
  let baseRow = Math.floor(count / (rowCount * (rowCount + 1) / 2));
  for (let r = 1; r <= rowCount; r++) {
    let n = Math.round(baseRow * r * 1.15);
    rows.push(n);
  }
  // תיקון סכום לשווה בדיוק ל-count
  let sum = rows.reduce((a,b)=>a+b,0);
  let diff = count - sum;
  rows[rows.length-1] += diff;

  const cx = 300, cyBase = 300;
  const rMin = 70, rMax = 260;
  const positions = [];
  rows.forEach((n, rIdx) => {
    const radius = rMin + (rMax - rMin) * (rIdx / (rows.length - 1 || 1));
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1);
      const angle = Math.PI - t * Math.PI; // 180° -> 0°
      const x = cx + radius * Math.cos(angle);
      const y = cyBase - radius * Math.sin(angle) * 0.95;
      positions.push({ x, y });
    }
  });
  return positions;
}

const seatList = buildSeatList();
const positions = layoutSeats(seatList.length);

const svg = document.getElementById('chart');
svg.setAttribute('viewBox', '0 0 600 320');

function renderSeats() {
  svg.innerHTML = '';
  positions.forEach((pos, i) => {
    const partyIndex = seatList[i];
    const party = parties[partyIndex];
    const isActive = coalitionOrder.includes(partyIndex);
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', pos.x);
    circle.setAttribute('cy', pos.y);
    circle.setAttribute('r', 6.2);
    circle.setAttribute('class','seat');
    circle.setAttribute('fill', isActive ? party.color : '#2a2e3a');
    svg.appendChild(circle);
  });
}

function renderPartyList() {
  const wrap = document.getElementById('parties');
  wrap.innerHTML = '';
  parties.forEach((p, idx) => {
    const inCoalition = coalitionOrder.includes(idx);
    const card = document.createElement('div');
    card.className = 'party-card' + (inCoalition ? ' selected locked' : '');
    card.innerHTML = `
      <span class="dot" style="background:${p.color}"></span>
      <span class="party-name">${p.name}</span>
      <span class="party-seats">${p.seats}</span>
    `;
    card.onclick = () => {
      if (pendingAdd || gameFinished) return; // אין שינוי תוך כדי שאלה פתוחה, ולא אחרי סיום
      if (inCoalition) {
        removeParty(idx);
      } else {
        attemptAdd(idx);
      }
    };
    wrap.appendChild(card);
  });
}

function currentTotal() {
  let total = 0;
  coalitionOrder.forEach(idx => total += parties[idx].seats);
  return total;
}

/* ---------- ניסיון הוספת מפלגה, כולל בדיקת קווים אדומים ---------- */
function attemptAdd(idx) {
  pendingAdd = { idx, tempWaivers: [] };
  processNextConflict();
}

/* ---------- הסרת מפלגה מהקואליציה, כולל ביטול הוויתורים שהיא עשתה כדי להצטרף ---------- */
function removeParty(idx) {
  const orderIdx = coalitionOrder.indexOf(idx);
  if (orderIdx === -1) return;
  coalitionOrder.splice(orderIdx, 1);

  let refunded = 0;
  [...new Set(parties[idx].redlines)].forEach(text => {
    const key = `${idx}::${text}`;
    if (waivers.has(key)) {
      waivers.delete(key);
      refunded++;
    }
  });
  waiverCount -= refunded;

  update();
}

// כל ההתנגשויות הפתוחות של idx מול מי שכבר בקואליציה, ממוינות
// לפי סדר ההצטרפות של הצד היריב - מי שנכנס קודם נבדק קודם.
// רק הקווים האדומים המוצהרים של idx עצמו (לא תגיות זהות פנימיות) יכולים
// ליזום שאלה - המפלגה החדשה היא תמיד זו ש"מתבקשת לוותר".
function getPendingConflicts(idx) {
  const party = parties[idx];
  const myTexts = [...new Set(party.redlines)];
  const conflicts = [];

  myTexts.forEach(text => {
    const waiverKey = `${idx}::${text}`;
    if (waivers.has(waiverKey)) return;

    // כל הצדדים שסותרים את הטקסט הזה, מכל כלל שבו הוא מופיע
    const otherSides = [];
    RULES.forEach(rule => {
      if (rule.a.type === 'text' && rule.a.value === text) otherSides.push(rule.b);
      else if (rule.b.type === 'text' && rule.b.value === text) otherSides.push(rule.a);
    });
    if (otherSides.length === 0) return;

    // המפלגה שכבר בקואליציה ומחזיקה באחד הצדדים הסותרים, שנכנסה הכי מוקדם
    let bestOpponent, bestJoinOrder = Infinity;
    coalitionOrder.forEach((mIdx, order) => {
      if (order < bestJoinOrder && otherSides.some(side => holds(parties[mIdx], side))) {
        bestOpponent = mIdx;
        bestJoinOrder = order;
      }
    });
    if (bestOpponent === undefined) return;

    conflicts.push({ waiverKey, opponentIdx: bestOpponent, promiseText: text, joinOrder: bestJoinOrder });
  });

  conflicts.sort((a, b) => a.joinOrder - b.joinOrder);
  return conflicts;
}

function processNextConflict() {
  const conflicts = getPendingConflicts(pendingAdd.idx);
  if (conflicts.length === 0) {
    coalitionOrder.push(pendingAdd.idx);
    pendingAdd = null;
    update();
    return;
  }
  const conflict = conflicts[0];
  showConflictModal(conflict);
}

const PLURAL_PROMISE_NAMES = new Set([
  "הליכוד", "בנט&לפיד", "ערבים", "רע\"מ", "חרדים אשכנז", "חרדים מזרח", "הנדל&זליכה",
]);

/* ---------- מודל גנרי: כותרת, טקסט, וכפתורים דינמיים ---------- */
function openModal(title, sub, buttons) {
  document.getElementById('cf-title').innerHTML = title;
  document.getElementById('cf-sub').textContent = sub;
  const actions = document.getElementById('cf-actions');
  actions.innerHTML = '';
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.className = b.cls;
    btn.innerHTML = b.label;
    btn.onclick = b.onClick;
    actions.appendChild(btn);
  });
  document.getElementById('overlay').classList.add('show');
}
function closeModal() {
  document.getElementById('overlay').classList.remove('show');
}

function abortPendingAdd() {
  pendingAdd.tempWaivers.forEach(w => {
    waivers.delete(w.waiverKey);
    waiverCount--;
  });
  pendingAdd = null;
}

function showConflictModal(conflict) {
  const party = parties[pendingAdd.idx];       // המפלגה החדשה - תמיד היא זו ש"הבטיחה"
  const opponent = parties[conflict.opponentIdx];
  const verb = PLURAL_PROMISE_NAMES.has(party.name) ? 'הבטיחו' : 'הבטיח';

  openModal(
    `אבל ${party.name} ${verb}:<br><span class="cf-redline">${conflict.promiseText}</span>`,
    `מוכנים לוותר ל${opponent.name}?`,
    [
      {
        label: 'לא מוותרים', cls: 'danger',
        onClick: () => {
          abortPendingAdd();
          closeModal();
          update();
        },
      },
      {
        label: '<span class="cf-angel-icon">' + GOOD_ANGEL_SVG + '</span>יאללה מוותרים', cls: 'go',
        onClick: () => {
          waivers.add(conflict.waiverKey);
          waiverCount++;
          pendingAdd.tempWaivers.push({ waiverKey: conflict.waiverKey });
          closeModal();
          const specialMsg = conflict.promiseText === 'רק לא ערבים' ? 'בעל הבית השתגע!' : null;
          showAngel(specialMsg);
          // מחכים שהמלאך יסיים את ההופעה שלו לפני שאלה נוספת על אותה מפלגה
          setTimeout(processNextConflict, ANGEL_DURATION);
        },
      },
    ]
  );
}

/* ---------- סטטיסטיקות (Supabase) ---------- */
const SUPABASE_URL = "https://eaixbkjghgpmlilybijf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhaXhia2pnaGdwbWxpbHliaWpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMTE2NjQsImV4cCI6MjEwNTU4NzY2NH0.12lUdBQfD_wBOocI96nFxWmNSFxVlzoZTJYQLC5uGME";

async function logEvent(type, partiesList) {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/events`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify({ type, parties: partiesList || null })
    });
  } catch (e) {}
}

function randomAngelMessage() {
  return ANGEL_MESSAGES[Math.floor(Math.random() * ANGEL_MESSAGES.length)];
}

function showAngel(message) {
  const el = document.createElement('div');
  el.className = 'angel-pop';
  const bubbleText = message || randomAngelMessage();
  el.innerHTML = `<div class="angel-bubble angel-score">${bubbleText}</div>` + GOOD_ANGEL_SVG;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ANGEL_DURATION);
}

function update() {
  renderSeats();
  renderPartyList();
  const total = currentTotal();
  const pct = Math.min(100, (total / TOTAL_SEATS) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';

  const statusEl = document.getElementById('status');
  if (total >= MAJORITY) {
    statusEl.textContent = `🎉 יש לכם קואליציה! ${total} / 120 מנדטים`;
    statusEl.className = 'ok';
  } else {
    statusEl.textContent = `${total} / 120 מנדטים (חסרים ${MAJORITY - total} להרכבת קואליציה)`;
    statusEl.className = 'no';
  }

  renderAngels();

  document.getElementById('finishBtn').disabled =
    gameFinished || (total < MAJORITY && !getTinyMinorityCheck());
}

/* ---------- שורת המלאכים: מלאך אחד לכל ויתור שנעשה (ללא הגבלה) ---------- */
function renderAngels() {
  const strip = document.getElementById('angels-strip');
  strip.innerHTML = '';
  if (waiverCount === 0) return;
  const wrap = document.createElement('div');
  wrap.className = 'angel-icon';
  wrap.innerHTML = GOOD_ANGEL_SVG;
  strip.appendChild(wrap);
  const count = document.createElement('span');
  count.className = 'angel-count';
  count.textContent = `× ${waiverCount}`;
  strip.appendChild(count);
}

function hasBlocBreak() {
  const camps = new Set();
  coalitionOrder.forEach(idx => {
    const c = parties[idx].camp;
    if (c) camps.add(c);
  });
  return camps.has('A') && camps.has('B');
}

/* בודקת אם הקואליציה הנוכחית זכאית להגשה כקואליציית מיעוט:
   לגוש היריב (שאינו מיוצג ברוב בקואליציה) יש פחות מנדטים,
   מתוך מה שנשאר לו מחוץ לקואליציה, מאשר סך הקואליציה עצמה. */
function getTinyMinorityCheck() {
  const total = currentTotal();
  let campASeats = 0, campBSeats = 0;
  coalitionOrder.forEach(idx => {
    const c = parties[idx].camp;
    if (c === 'A') campASeats += parties[idx].seats;
    else if (c === 'B') campBSeats += parties[idx].seats;
  });

  let myCamp = null;
  if (campASeats > campBSeats) myCamp = 'A';
  else if (campBSeats > campASeats) myCamp = 'B';
  if (!myCamp) return false; // אין גוש דומיננטי בקואליציה - אין "גוש שני" מוגדר

  const otherCamp = myCamp === 'A' ? 'B' : 'A';
  const otherRemaining = parties.reduce((sum, p, idx) => {
    if (p.camp === otherCamp && !coalitionOrder.includes(idx)) return sum + p.seats;
    return sum;
  }, 0);

  return otherRemaining < total;
}

function showResults() {
  gameFinished = true;
  logEvent('submit');
  const total = currentTotal();

  let img, msg, quote = '';
  if (total < MAJORITY && getTinyMinorityCheck()) {
    img = RESULT_IMAGES.tiny;
    msg = 'מה זה צריך להיות? זה אפילו לא רוב?';
    quote = 'מילה מהגננת: "תפסיקו לזרוק את הגושים שלכם אחד על השני!".';
  } else if (hasBlocBreak() && total > 80 && waiverCount >= 3) {
    img = RESULT_IMAGES.smile;
    msg = 'תנו לי מה שלקחתם! אחדות היא השם האמצעי שלכם!';
    quote = 'מילה מהגננת: "צריך ללמוד יותר לעמוד על שלכם ולא לוותר."';
  } else if (hasBlocBreak()) {
    img = RESULT_IMAGES.neutral;
    msg = 'חשבת לעבוד בגישור? פתרת את הפלונטר בקלאס בקצת מאמץ.';
    quote = 'מילה מהגננת: "כל הכבוד! הפסקת את ההתגוששות בין הגושים!"';
  } else {
    img = RESULT_IMAGES.frustrated;
    msg = 'וואלה שיחקת בונקר, חילצת ממשלה צרה, לפחות הרגזת רק חצי עם, ואת הנשיא.';
    quote = 'מילה מהגננת: "ככה זה כשלא מוותרים לאחרים"';
  }

  document.getElementById('res-body').innerHTML = `
    <img class="res-img" src="${img}" alt="">
    <div class="res-msg">${msg}</div>
    ${quote ? `<div class="res-quote">${quote}</div>` : ''}
    מנדטים: ${total} / 120<br>
    ויתורים שנעשו: ${waiverCount}
  `;
  document.getElementById('resultsOverlay').classList.add('show');
  renderPartyList();
}

document.getElementById('finishBtn').onclick = () => {
  showResults();
};

document.getElementById('infoBtn').onclick = () => {
  document.getElementById('infoBubble').classList.toggle('show');
};

document.getElementById('resetBtn').onclick = () => location.reload();

document.getElementById('res-close').onclick = () => {
  document.getElementById('resultsOverlay').classList.remove('show');
  gameFinished = false;
  update();
};

document.getElementById('res-share').onclick = async () => {
  const namesList = coalitionOrder.map(idx => parties[idx].name);
  const names = namesList.join(', ');
  logEvent('share', namesList);
  const text = `הרכבתי קואליציה של ${currentTotal()} מנדטים (${names}) עם ${waiverCount} ויתורים במשחק שלח לי מלאך! 👼`;
  if (navigator.share) {
    try { await navigator.share({ text }); } catch (e) {}
  } else {
    await navigator.clipboard.writeText(text);
    alert('הטקסט הועתק ללוח! ' + text);
  }
};

update();
logEvent('visit');
</script>
